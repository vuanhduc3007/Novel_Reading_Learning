[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_USE_MOCK_API = "false"
  VITE_API_BASE_URL = "https://chinese-reader-api.onrender.com"
  # Accounts & sync (Supabase). The publishable key is meant to be public;
  # data is protected by Row Level Security (supabase/schema.sql).
  VITE_SUPABASE_URL = "https://ngdjatakpbvaahkmroqp.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_Y6CLwbUg8edkvrxF1bQ7rQ_fueJTe4P"

# A file of an older build that no longer exists must be a 404, not the app's
# HTML: otherwise a page opened before a deploy fails to load it with a
# confusing error. (Redirects only apply when no file exists at the path.)
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
